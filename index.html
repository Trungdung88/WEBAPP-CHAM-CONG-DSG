<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Chấm Công (Firebase Thời Gian Thực)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .table-container { width: 100%; overflow-x: auto; }
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border: 1px solid #e2e8f0; white-space: nowrap; text-align: center; padding: 0.5rem; }
        th:first-child, td:first-child,
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 0; z-index: 10; background-color: white; }
        th:first-child, td:first-child { width: 200px; min-width: 200px; }
        th:nth-child(2), td:nth-child(2) { left: 200px; width: 150px; min-width: 150px; }
        .weekend { background-color: #f7fafc; }
        .status-popover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .status-popover button { padding: 0.5rem; border-radius: 0.25rem; font-size: 0.875rem; font-weight: 600; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
        td.pending-request::after {
            content: ''; position: absolute; top: 2px; right: 2px;
            width: 8px; height: 8px; background-color: #f59e0b;
            border-radius: 50%; border: 1px solid white;
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Login/Selection Screen -->
    <div id="login-screen" class="fixed inset-0 bg-gray-100 flex items-center justify-center z-50">
        <div class="w-full max-w-sm p-8 bg-white rounded-lg shadow-md text-center">
            <div id="loader" class="mb-4">
                <div class="loader mx-auto"></div>
                <p class="text-gray-600 mt-2">Đang kết nối đến máy chủ...</p>
            </div>
            <div id="login-form-container" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Chọn Người Dùng</h2>
                <p class="text-gray-500 mb-6">Chọn tên của bạn để bắt đầu</p>
                <form id="login-form">
                    <div class="mb-4">
                        <select id="user-select-login" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></select>
                    </div>
                    <div id="admin-password-container" class="hidden my-4">
                        <label for="admin-password" class="block text-sm font-medium text-gray-700">Mật khẩu Admin</label>
                        <input type="password" id="admin-password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700">Bắt đầu</button>
                    <p id="login-error" class="text-red-500 text-sm mt-4"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App Content (hidden by default) -->
    <div id="app" class="p-4 sm:p-6 lg:p-8 hidden">
        <!-- Header, Month Navigator, Table... -->
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Bảng Chấm Công Thời Gian Thực</h1>
                <p class="text-sm text-gray-500">Trường Trung Cấp Đông Sài Gòn</p>
            </div>
            <div id="user-actions" class="flex items-center space-x-4 mt-4 sm:mt-0">
                 <div id="admin-view" class="hidden items-center space-x-4">
                    <span class="font-medium text-blue-600">Logged in as: Admin</span>
                    <button id="admin-requests-btn" class="bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-yellow-600 transition relative">
                        Duyệt Yêu Cầu
                        <span id="pending-requests-badge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center"></span>
                    </button>
                 </div>
                 <button id="export-csv-btn" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-green-700 transition">Xuất File</button>
                 <button id="logout-btn" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-red-700 transition">Thoát</button>
            </div>
        </div>

        <!-- User Action Buttons -->
        <div id="logged-in-user-actions" class="mb-6 flex items-center space-x-3">
             <span id="current-user-name" class="font-semibold"></span>
             <button id="request-leave-btn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition">Xin Nghỉ</button>
             <button id="request-late-btn" class="bg-orange-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-orange-600 transition">Báo Trễ</button>
        </div>

        <!-- Month Navigator -->
        <div class="flex items-center justify-center space-x-4 bg-white p-3 rounded-lg shadow-sm mb-6">
            <button id="prev-month-btn" class="p-2 rounded-md hover:bg-gray-100">&lt; Tháng Trước</button>
            <h2 id="current-month-display" class="text-xl font-bold w-48 text-center"></h2>
            <button id="next-month-btn" class="p-2 rounded-md hover:bg-gray-100">Tháng Sau &gt;</button>
            <button id="today-btn" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition">Hôm Nay</button>
        </div>

        <!-- Timesheet Table -->
        <div id="timesheet-container" class="table-container bg-white rounded-lg shadow-sm">
            <table class="w-full text-sm">
                <thead id="timesheet-head" class="bg-gray-100 text-gray-600 uppercase"></thead>
                <tbody id="timesheet-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modals -->
    <div id="user-request-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-30 hidden"></div>
    <div id="admin-requests-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-30 hidden"></div>
    <div id="status-popover" class="status-popover hidden absolute bg-white border border-gray-200 rounded-lg p-2 z-20">
         <div class="grid grid-cols-4 gap-2">
            <button data-status="X" class="status-btn">X</button> <button data-status="X/2" class="status-btn">X/2</button> <button data-status="P" class="status-btn">P</button> <button data-status="VR" class="status-btn">VR</button> <button data-status="No" class="status-btn">No</button> <button data-status="Nb" class="status-btn">Nb</button> <button data-status="L" class="status-btn">L</button> <button data-status="Ô" class="status-btn">Ô</button> <button data-status="Ts" class="status-btn">Ts</button> <button data-status="H" class="status-btn">H</button> <button data-status="Cđ" class="status-btn">Cđ</button> <button data-status="" class="status-btn">Xóa</button>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIG & STATE ---
        // Import the functions you need from the SDKs you need
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCfl-dcyySZCRFD0ZbvzyZ7vuF7mHDd2EA",
  authDomain: "cham-cong-dsg-6aea5.firebaseapp.com",
  projectId: "cham-cong-dsg-6aea5",
  storageBucket: "cham-cong-dsg-6aea5.firebasestorage.app",
  messagingSenderId: "1088507632829",
  appId: "1:1088507632829:web:547dea09d8f17d920c6bd4"
};

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cham-cong-default';

        const ADMIN_INFO = {
            id: 'emp2', name: 'Trần Nguyễn Trung Dũng', position: 'TP. Đào tạo', sortOrder: 2,
            password: 'Daotao@01202403'
        };

        let app, auth, db;
        let unsubscribeTimesheet, unsubscribeRequests;

        let currentUserInfo = {};
        let currentDate = new Date(2025, 0, 1);
        let employees = [];
        let attendanceData = {};
        let requests = [];
        
        const popover = document.getElementById('status-popover');
        let currentCell = { employeeId: null, day: null };

        const STATUS_MAP = { "X": { text: "X", class: "bg-green-100 text-green-800" }, "X/2": { text: "X/2", class: "bg-teal-100 text-teal-800" }, "P": { text: "P", class: "bg-blue-100 text-blue-800" }, "VR": { text: "VR", class: "bg-indigo-100 text-indigo-800" }, "L": { text: "L", class: "bg-purple-100 text-purple-800" }, "Ô": { text: "Ô", class: "bg-amber-100 text-amber-800" }, "Ts": { text: "Ts", class: "bg-pink-100 text-pink-800" }, "Nb": { text: "Nb", class: "bg-cyan-100 text-cyan-800" }, "No": { text: "No", class: "bg-orange-100 text-orange-800" }, "H": { text: "H", class: "bg-gray-200 text-gray-700" }, "Cđ": { text: "Cđ", class: "bg-lime-100 text-lime-800" }, };
        const STATUS_COUNT = { workDays: { label: 'Công', statuses: {'X': 1, 'X/2': 0.5, 'H': 1, 'Cđ': 1} }, paidLeave: { label: 'Nghỉ P', statuses: {'P': 1} }, unpaidLeave: { label: 'Nghỉ KL', statuses: {'No': 1, 'VR': 1} }, insuranceLeave: { label: 'Nghỉ BHXH', statuses: {'Ô': 1, 'Ts': 1} }, holiday: { label: 'Lễ', statuses: {'L': 1} }, compensatedLeave: { label: 'Nghỉ Bù', statuses: {'Nb': 1} }, };

        // --- INITIALIZATION ---
        async function initialize() {
            if (!firebaseConfig.projectId) {
                document.getElementById('loader').innerHTML = `<p class="text-red-500">Lỗi: Cấu hình Firebase chưa được thiết lập.</p>`;
                return;
            }
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        console.log("Anonymous user signed in:", user.uid);
                        await setupInitialData();
                        showLoginScreen();
                    }
                });
                await signInAnonymously(auth);

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                document.getElementById('loader').innerHTML = `<p class="text-red-500">Lỗi kết nối Firebase. Vui lòng kiểm tra cấu hình.</p>`;
            }
        }

        async function setupInitialData() {
            const initialEmployees = [ { id: 'emp1', name: 'Trần Huyền Vân', position: 'Phó Hiệu Trưởng', sortOrder: 1 }, { ...ADMIN_INFO, password: null }, // remove password from db
                { id: 'emp3', name: 'Đoàn Hồng Hải Vân', position: 'VC. P. Đào tạo', sortOrder: 3 }, { id: 'emp4', name: 'Nguyễn Thùy Dung', position: 'VC. P. Đào tạo', sortOrder: 4 }, { id: 'emp5', name: 'Võ Hoàng Thanh', position: 'VC. P. Đào tạo', sortOrder: 5 }, ];

            const docRef = doc(db, `artifacts/${appId}/public/data`, 'employees');
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                console.log("No employee data found. Creating initial set...");
                await setDoc(docRef, { list: initialEmployees });
                employees = initialEmployees;
            } else {
                employees = docSnap.data().list;
            }
            employees.sort((a,b) => a.sortOrder - b.sortOrder);
        }

        // --- DATA SYNC ---
        function syncDataForMonth() {
            if(unsubscribeTimesheet) unsubscribeTimesheet();
            if(unsubscribeRequests) unsubscribeRequests();

            const monthId = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
            
            const timesheetDocRef = doc(db, `artifacts/${appId}/public/data/timesheets`, monthId);
            unsubscribeTimesheet = onSnapshot(timesheetDocRef, (docSnap) => {
                attendanceData = docSnap.exists() ? docSnap.data() : {};
                render();
            });

            const requestsDocRef = doc(db, `artifacts/${appId}/public/data/requests`, monthId);
            unsubscribeRequests = onSnapshot(requestsDocRef, (docSnap) => {
                requests = docSnap.exists() ? docSnap.data().list || [] : [];
                render();
            });
        }
        
        async function updateAttendance(employeeId, day, status) {
            const monthId = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
            const docRef = doc(db, `artifacts/${appId}/public/data/timesheets`, monthId);
            const fieldPath = `${employeeId}.${day}`;
            
            const payload = {};
            if (status) {
                payload[fieldPath] = status;
            } else {
                // To delete a field, you must provide the full path to the field.
                // Firestore doesn't have a simple 'delete' operation within an update,
                // so we set it to a special value like null or an empty string,
                // or we read the whole doc, modify, and set. For simplicity here, we set to empty.
                 payload[fieldPath] = "";
            }
            await setDoc(docRef, payload, { merge: true });
        }
        
        async function updateUserRequest(newRequest) {
            const monthId = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
            const docRef = doc(db, `artifacts/${appId}/public/data/requests`, monthId);
            const currentRequests = [...requests, newRequest];
            await setDoc(docRef, { list: currentRequests }, { merge: true });
        }

        async function handleRequestAction(reqId, action) {
            const monthId = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
            const docRef = doc(db, `artifacts/${appId}/public/data/requests`, monthId);
            const reqIndex = requests.findIndex(r => r.id === reqId);
            if(reqIndex === -1) return;

            const updatedRequests = [...requests];
            const req = updatedRequests[reqIndex];
            req.status = action === 'approve' ? 'approved' : 'rejected';
            
            if (action === 'approve' && req.type === 'edit') {
                 const reqDate = new Date(req.date);
                 await updateAttendance(req.employeeId, reqDate.getDate(), req.details.newStatus);
            }

            await setDoc(docRef, { list: updatedRequests });
        }


        // --- UI & ROLE MANAGEMENT ---
        function showLoginScreen() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('login-form-container').classList.remove('hidden');
            const userSelect = document.getElementById('user-select-login');
            userSelect.innerHTML = '<option value="" disabled selected>-- Vui lòng chọn --</option>';
            employees.forEach(emp => {
                userSelect.innerHTML += `<option value="${emp.id}">${emp.name}</option>`;
            });
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            syncDataForMonth();
            render();
        }

        function updateUIForRole() {
            const isAdmin = currentUserInfo.id === ADMIN_INFO.id;
            document.getElementById('admin-view').style.display = isAdmin ? 'flex' : 'none';
            document.getElementById('logged-in-user-actions').style.display = isAdmin ? 'none' : 'flex';
            
            if (isAdmin) {
                document.getElementById('current-user-name').textContent = '';
            } else {
                 document.getElementById('current-user-name').textContent = `Xin chào, ${currentUserInfo.name}`;
            }

            const pendingCount = requests.filter(r => r.status === 'pending').length;
            const badge = document.getElementById('pending-requests-badge');
            if (pendingCount > 0) {
                badge.textContent = pendingCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
        
        function setCurrentUser(userId) {
            currentUserInfo = employees.find(emp => emp.id === userId) || {};
            showApp();
        }
        
        // All other functions (render, modals, actions) are mostly the same
        // but now use Firestore functions to update data.
        // The complete, working logic is included in the second script tag below.
        
        initialize();
    </script>
    <script>
    // --- SECOND SCRIPT BLOCK FOR FULL FUNCTIONALITY ---
    document.addEventListener('DOMContentLoaded', () => {
        // --- EVENT LISTENERS ---
        document.getElementById('user-select-login').addEventListener('change', (e) => {
            const selectedId = e.target.value;
            const container = document.getElementById('admin-password-container');
            if (selectedId === ADMIN_INFO.id) {
                container.classList.remove('hidden');
                document.getElementById('admin-password').required = true;
            } else {
                container.classList.add('hidden');
                document.getElementById('admin-password').required = false;
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedId = document.getElementById('user-select-login').value;
            if (!selectedId) {
                document.getElementById('login-error').textContent = 'Vui lòng chọn tên.';
                return;
            }
            
            if (selectedId === ADMIN_INFO.id) {
                const password = document.getElementById('admin-password').value;
                if (password === ADMIN_INFO.password) {
                    window.setCurrentUser(selectedId);
                } else {
                    document.getElementById('login-error').textContent = 'Mật khẩu không đúng.';
                }
            } else {
                window.setCurrentUser(selectedId);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.reload();
        });

        // Other event listeners are the same as the previous version
        document.getElementById('prev-month-btn').addEventListener('click', () => window.handleMonthChange(-1));
        document.getElementById('next-month-btn').addEventListener('click', () => window.handleMonthChange(1));
        document.getElementById('today-btn').addEventListener('click', () => window.handleToday());
        document.getElementById('export-csv-btn').addEventListener('click', () => window.exportToCSV());
        document.getElementById('admin-requests-btn').addEventListener('click', () => window.openAdminRequestsModal());
        document.getElementById('request-leave-btn').addEventListener('click', () => window.openUserRequestModal('leave', new Date().getDate()));
        document.getElementById('request-late-btn').addEventListener('click', () => window.openUserRequestModal('late', new Date().getDate()));

         document.getElementById('timesheet-body').addEventListener('click', (e) => {
            const cell = e.target.closest('td');
            if (!cell || !cell.dataset.employeeId) return;

            const { employeeId, day } = cell.dataset;
            const isAdmin = window.currentUserInfo.id === ADMIN_INFO.id;
            const isSelf = employeeId === window.currentUserInfo.id;
            const cellHasData = window.attendanceData[employeeId] && window.attendanceData[employeeId][day];

            if (isAdmin) {
                const rect = cell.getBoundingClientRect();
                window.popover.classList.remove('hidden');
                window.popover.style.left = `${rect.left + window.scrollX}px`;
                window.popover.style.top = `${rect.bottom + window.scrollY + 5}px`;
                window.currentCell = { employeeId, day };
            } else if (isSelf) {
                if (cellHasData) {
                    window.openUserRequestModal('edit', day);
                } else {
                    if (confirm(`Bạn muốn chấm công (X) cho ngày ${day}?`)) {
                        window.updateAttendance(employeeId, day, 'X');
                    }
                }
            } else {
                alert('Bạn chỉ có thể thao tác trên dòng của mình.');
            }
        });

        window.popover.addEventListener('click', (e) => {
            const button = e.target.closest('.status-btn');
            if (button) {
                const { employeeId, day } = window.currentCell;
                if (employeeId && day) {
                    window.updateAttendance(employeeId, day, button.dataset.status);
                }
                window.popover.classList.add('hidden');
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!window.popover.contains(e.target) && !e.target.closest('td[data-employee-id]')) {
                window.popover.classList.add('hidden');
            }
        });
    });

    // --- GLOBAL FUNCTIONS ---
    window.closeModal = (modalId) => {
        const modal = document.getElementById(modalId);
        if (modal) modal.classList.add('hidden');
    }
    
    window.renderHeader = function renderHeader() {
            const year = window.currentDate.getFullYear();
            const month = window.currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const head = document.getElementById('timesheet-head');
            let headerHTML = `<tr><th class="p-2 w-48 text-left">Họ và Tên</th><th class="p-2 w-36 text-left">Chức vụ</th>`;
            for (let day = 1; day <= daysInMonth; day++) {
                headerHTML += `<th class="p-2 text-center w-12">${day}</th>`;
            }
            Object.values(window.STATUS_COUNT).forEach(status => headerHTML += `<th class="p-2 w-20">${status.label}</th>`);
            headerHTML += `</tr><tr><th></th><th></th>`;
            const weekdays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
            for (let day = 1; day <= daysInMonth; day++) {
                const dayOfWeek = new Date(year, month, day).getDay();
                headerHTML += `<th class="p-2 text-xs font-normal ${dayOfWeek % 6 === 0 ? 'weekend' : ''}">${weekdays[dayOfWeek]}</th>`;
            }
            Object.values(window.STATUS_COUNT).forEach(() => headerHTML += `<th></th>`);
            headerHTML += `</tr>`;
            head.innerHTML = headerHTML;
            document.getElementById('current-month-display').innerText = `Tháng ${month + 1}, ${year}`;
    }

    window.renderBody = function renderBody() {
            const year = window.currentDate.getFullYear();
            const month = window.currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const body = document.getElementById('timesheet-body');
            let bodyHTML = '';

            const pendingRequestsMap = new Map();
            window.requests.filter(r => r.status === 'pending' && r.type === 'edit').forEach(r => {
                const key = `${r.employeeId}-${new Date(r.date).getDate()}`;
                pendingRequestsMap.set(key, true);
            });

            window.employees.forEach(emp => {
                const empAttendance = window.attendanceData[emp.id] || {};
                const summaries = Object.keys(window.STATUS_COUNT).reduce((acc, key) => ({ ...acc, [key]: 0 }), {});
                for (let day = 1; day <= daysInMonth; day++) {
                    const status = empAttendance[day];
                    if (status) {
                        for (const [summaryKey, config] of Object.entries(window.STATUS_COUNT)) {
                            if (config.statuses[status]) summaries[summaryKey] += config.statuses[status];
                        }
                    }
                }
                
                let rowHTML = `<td class="p-2 text-left font-medium">${emp.name}</td><td class="p-2 text-left text-gray-600">${emp.position}</td>`;
                for (let day = 1; day <= daysInMonth; day++) {
                    const isWeekend = new Date(year, month, day).getDay() % 6 === 0;
                    const status = empAttendance[day] || '';
                    const statusInfo = window.STATUS_MAP[status] || {};
                    const hasPending = pendingRequestsMap.has(`${emp.id}-${day}`);
                    rowHTML += `<td data-employee-id="${emp.id}" data-day="${day}" class="p-2 cursor-pointer hover:bg-yellow-100 transition-colors ${isWeekend ? 'weekend' : ''} ${statusInfo.class || ''} ${hasPending ? 'pending-request' : ''}">${statusInfo.text || ''}</td>`;
                }
                Object.values(summaries).forEach(val => { rowHTML += `<td class="p-2 font-bold">${val || 0}</td>`; });
                bodyHTML += `<tr>${rowHTML}</tr>`;
            });
            body.innerHTML = bodyHTML;
    }

    window.render = function render() {
        if(document.getElementById('timesheet-head')) {
             window.renderHeader(); 
             window.renderBody(); 
             window.updateUIForRole();
        }
    }

    window.openUserRequestModal = function openUserRequestModal(type, day = null) {
            const modal = document.getElementById('user-request-modal');
            const date = new Date(window.currentDate);
            if(day) date.setDate(day);
            const dateString = date.toLocaleDateString('vi-VN');
            let title = '';
            let formContent = `
                <input type="hidden" id="request-type" value="${type}">
                <input type="hidden" id="request-date" value="${date.toISOString()}">
                <div class="mb-4"><span class="font-semibold">Ngày:</span> ${dateString}</div>`;

            switch(type) {
                case 'edit':
                    title = 'Đề xuất Chỉnh sửa Chấm công';
                    formContent += `<div class="mb-4"><label for="request-status" class="block text-sm font-medium text-gray-700">Trạng thái đúng:</label><select id="request-status" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md">${Object.keys(window.STATUS_MAP).map(s => `<option value="${s}">${s}</option>`).join('')}</select></div><div class="mb-4"><label for="request-reason" class="block text-sm font-medium text-gray-700">Lý do:</label><textarea id="request-reason" required rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea></div>`;
                    break;
                case 'leave':
                    title = 'Đơn Xin Nghỉ';
                     formContent += `<div class="mb-4"><label for="request-reason" class="block text-sm font-medium text-gray-700">Lý do nghỉ:</label><textarea id="request-reason" required rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea></div>`;
                    break;
                case 'late':
                     title = 'Báo Đi Trễ';
                     formContent += `<div class="mb-4"><label for="request-time" class="block text-sm font-medium text-gray-700">Thời gian dự kiến đến:</label><input type="time" id="request-time" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></div><div class="mb-4"><label for="request-reason" class="block text-sm font-medium text-gray-700">Lý do đi trễ:</label><textarea id="request-reason" required rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea></div>`;
                    break;
            }

            modal.innerHTML = `<div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-lg"><h3 class="text-xl font-semibold mb-4">${title}</h3><form id="user-request-form">${formContent}<div class="flex justify-end space-x-3 mt-6"><button type="button" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 cancel-btn">Hủy</button><button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700">Gửi Yêu Cầu</button></div></form></div>`;
            modal.classList.remove('hidden');
            modal.querySelector('.cancel-btn').addEventListener('click', () => window.closeModal('user-request-modal'));
            modal.querySelector('#user-request-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newRequest = {
                    id: `req_${Date.now()}`, employeeId: window.currentUserInfo.id, employeeName: window.currentUserInfo.name, status: 'pending',
                    type: document.getElementById('request-type').value, date: document.getElementById('request-date').value,
                    reason: document.getElementById('request-reason').value, details: {}
                };
                if(newRequest.type === 'edit') newRequest.details.newStatus = document.getElementById('request-status').value;
                if(newRequest.type === 'late') newRequest.details.lateTime = document.getElementById('request-time').value;

                await window.updateUserRequest(newRequest);
                window.closeModal('user-request-modal');
                alert('Đã gửi yêu cầu thành công!');
            });
    }

    window.openAdminRequestsModal = function openAdminRequestsModal() {
            const modal = document.getElementById('admin-requests-modal');
            const pendingRequests = window.requests.filter(r => r.status === 'pending');
            let content = `<h3 class="text-xl font-semibold mb-4">Danh sách Yêu cầu Chờ Duyệt</h3>`;
            if (pendingRequests.length === 0) {
                content += `<p class="text-gray-600">Không có yêu cầu nào đang chờ.</p>`;
            } else {
                content += `<div class="space-y-4 max-h-96 overflow-y-auto">`;
                pendingRequests.forEach(req => {
                    const reqDate = new Date(req.date);
                    let details = `Lý do: ${req.reason}`;
                    if(req.type === 'edit') details += `<br><b>Sửa thành:</b> ${req.details.newStatus}`;
                    if(req.type === 'late') details += `<br><b>Giờ đến:</b> ${req.details.lateTime}`;

                    content += `<div class="border rounded-lg p-3"><p><b>Người gửi:</b> ${req.employeeName}</p><p><b>Loại:</b> ${req.type === 'edit' ? 'Sửa công' : (req.type === 'leave' ? 'Xin nghỉ' : 'Báo trễ')}</p><p><b>Ngày:</b> ${reqDate.toLocaleDateString('vi-VN')}</p><p class="text-sm text-gray-700 mt-1">${details}</p><div class="flex justify-end space-x-2 mt-2"><button data-req-id="${req.id}" data-action="reject" class="action-btn bg-red-500 text-white px-3 py-1 text-sm rounded hover:bg-red-600">Từ chối</button><button data-req-id="${req.id}" data-action="approve" class="action-btn bg-green-500 text-white px-3 py-1 text-sm rounded hover:bg-green-600">Đồng ý</button></div></div>`;
                });
                content += `</div>`;
            }
            
            modal.innerHTML = `<div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl">${content}<div class="flex justify-end mt-6"><button type="button" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 cancel-btn">Đóng</button></div></div>`;
            modal.classList.remove('hidden');
            modal.querySelector('.cancel-btn').addEventListener('click', () => window.closeModal('admin-requests-modal'));
            modal.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    window.handleRequestAction(e.target.dataset.reqId, e.target.dataset.action);
                });
            });
    }

    window.handleMonthChange = function handleMonthChange(offset) {
        window.currentDate.setMonth(window.currentDate.getMonth() + offset);
        window.syncDataForMonth();
    }
    
    window.handleToday = function handleToday() {
        window.currentDate = new Date();
        window.syncDataForMonth();
    }

    window.exportToCSV = function exportToCSV() {
            const year = window.currentDate.getFullYear();
            const month = window.currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";

            let header1 = ["STT", "Họ và Tên", "Chức vụ"];
            for (let day = 1; day <= daysInMonth; day++) header1.push(day);
            Object.values(window.STATUS_COUNT).forEach(status => header1.push(status.label));
            csvContent += header1.join(',') + '\r\n';

            window.employees.forEach((emp, index) => {
                let row = [index + 1, `"${emp.name}"`, `"${emp.position}"`];
                const empAttendance = window.attendanceData[emp.id] || {};
                const summaries = Object.keys(window.STATUS_COUNT).reduce((acc, key) => ({ ...acc, [key]: 0 }), {});

                for (let day = 1; day <= daysInMonth; day++) {
                    const status = empAttendance[day] || '';
                    row.push(status);
                    if (status) {
                        for (const [summaryKey, config] of Object.entries(window.STATUS_COUNT)) {
                            if (config.statuses[status]) summaries[summaryKey] += config.statuses[status];
                        }
                    }
                }
                Object.values(summaries).forEach(val => row.push(val || 0));
                csvContent += row.join(',') + '\r\n';
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Bang_Cham_Cong_Thang_${month + 1}_${year}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
    }
    </script>
</body>
